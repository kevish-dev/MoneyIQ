name: MoneyIQ
options:
  bundleIdPrefix: com.moneyiq
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"

configFiles:
  Debug: Config/Secrets.xcconfig
  Release: Config/Secrets.xcconfig

packages:
  MoneyIQCore:
    path: MoneyIQCore

targets:
  MoneyIQ-iOS:
    type: application
    platform: iOS
    sources:
      - path: iOS/MoneyIQ
        excludes:
          - Info.plist
      - path: Shared
    info:
      path: iOS/MoneyIQ/Info.plist
      properties:
        UILaunchScreen: {}
        NSFaceIDUsageDescription: "MoneyIQ uses Face ID to keep your financial data private."
        NSSupportsLiveActivities: true
        MIQ_GOOGLE_CLIENT_ID: $(MIQ_GOOGLE_CLIENT_ID)
        MIQ_GOOGLE_REDIRECT_URI: $(MIQ_GOOGLE_REDIRECT_URI)
        MIQ_GITHUB_CLIENT_ID: $(MIQ_GITHUB_CLIENT_ID)
        MIQ_GITHUB_REDIRECT_URI: $(MIQ_GITHUB_REDIRECT_URI)
        CFBundleURLTypes:
          - CFBundleURLName: com.moneyiq.oauth
            CFBundleURLSchemes:
              - moneyiq
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moneyiq.ios
        PRODUCT_NAME: MoneyIQ
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: MoneyIQCore
      - target: MoneyIQWidgets
        embed: true
      - target: MoneyIQShareExtension
        embed: true

  MoneyIQShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: iOS/MoneyIQShareExtension
    info:
      path: iOS/MoneyIQShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Add to MoneyIQ
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsImageWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moneyiq.ios.shareextension
        PRODUCT_NAME: MoneyIQShareExtension
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        SKIP_INSTALL: true
        GENERATE_INFOPLIST_FILE: false
    dependencies:
      - package: MoneyIQCore

  MoneyIQWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: iOS/MoneyIQWidgets
    info:
      path: iOS/MoneyIQWidgets/Info.plist
      properties:
        CFBundleDisplayName: MoneyIQ Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moneyiq.ios.widgets
        PRODUCT_NAME: MoneyIQWidgets
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        SKIP_INSTALL: true
        GENERATE_INFOPLIST_FILE: false
    dependencies:
      - package: MoneyIQCore

  MoneyIQ-macOS:
    type: application
    platform: macOS
    sources:
      - path: macOS/MoneyIQ
        excludes:
          - Info.plist
      - path: Shared
    info:
      path: macOS/MoneyIQ/Info.plist
      properties:
        MIQ_GOOGLE_CLIENT_ID: $(MIQ_GOOGLE_CLIENT_ID)
        MIQ_GOOGLE_REDIRECT_URI: $(MIQ_GOOGLE_REDIRECT_URI)
        MIQ_GITHUB_CLIENT_ID: $(MIQ_GITHUB_CLIENT_ID)
        MIQ_GITHUB_REDIRECT_URI: $(MIQ_GITHUB_REDIRECT_URI)
        CFBundleURLTypes:
          - CFBundleURLName: com.moneyiq.oauth
            CFBundleURLSchemes:
              - moneyiq
    entitlements:
      path: macOS/MoneyIQ/MoneyIQ.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moneyiq.macos
        PRODUCT_NAME: MoneyIQ
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        COMBINE_HIDPI_IMAGES: true
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: MoneyIQCore

schemes:
  MoneyIQ-iOS:
    build:
      targets:
        MoneyIQ-iOS: all
    run:
      config: Debug
    test:
      config: Debug
  MoneyIQ-macOS:
    build:
      targets:
        MoneyIQ-macOS: all
    run:
      config: Debug
    test:
      config: Debug
